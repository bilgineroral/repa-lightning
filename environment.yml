# Create: conda env create -f environment.yml
# Activate: conda activate repa
# Direct dependency versions selected and tested on 2026-10-06 (Linux/NVIDIA).
name: repa
channels:
  - defaults
dependencies:
  - python=3.14.8
  - pip
  - pip:
      - torch==2.14.1
      - torchvision==0.29.1
      - pytorch-lightning==2.6.6
      - lightning==2.6.6
      - transformers==5.19.0
      - timm==1.0.30
      - numpy==2.5.3
      - pillow==12.3.0
      - opencv-python-headless==5.0.0.93
      - wandb==0.30.0
      # Tokenizers 0.23.2 (required by Transformers) requires Hub <2.0.
      - huggingface-hub==1.33.0
variables:
  PYTHONNOUSERSITE: "1"
